map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    resolver 127.0.0.11 ipv6=off valid=10s;

    location / {
        proxy_pass http://web:8000;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location ~ ^/terminal/(?<attempt_id>[0-9]+)/ {
        auth_request /_terminal_auth;

        auth_request_set $terminal_upstream
            $upstream_http_x_terminal_upstream;

        proxy_pass http://$terminal_upstream;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location = /_terminal_auth {
        internal;

        proxy_pass http://web:8000/terminal-auth/;

        proxy_pass_request_body off;
        proxy_set_header Content-Length "";

        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $http_host;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
}