name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  workflow-policy:
    name: Check CI and manual CD boundaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install workflow policy parser
        run: python -m pip install PyYAML==6.0.2
      - name: Check workflows and regression tests
        run: |
          python deploy/ci/workflow_policy.py
          python -m unittest discover -s deploy/ci -p 'test_*.py' -v

  tests:
    needs: workflow-policy
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: test-secret-key
      DEBUG: "True"
      DB_ENGINE: django.db.backends.sqlite3
      DB_NAME: ":memory:"
      TERMINAL_GATEWAY_ENABLED: "true"
      CHECK_TASK_TIMEOUT_SECONDS: "60"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Collect production static assets
        env:
          DEBUG: "False"
        run: python manage.py collectstatic --noinput

      - name: React integration tests
        run: python manage.py test react_frontend

      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Django system check
        run: python manage.py check

      - name: Django deploy check
        env:
          SECRET_KEY: "ci-deploy-check-secret-key-with-enough-length-and-variety-2026"
          DEBUG: "False"
          ALLOWED_HOSTS: "example.com"
          CSRF_TRUSTED_ORIGINS: "https://example.com"
          DB_ENGINE: django.db.backends.sqlite3
          DB_NAME: ":memory:"
          TERMINAL_GATEWAY_ENABLED: "true"
          CHECK_TASK_TIMEOUT_SECONDS: "60"
        run: python manage.py check --deploy

      - name: Check training tasks sync
        env:
          DB_ENGINE: django.db.backends.sqlite3
          DB_NAME: ci-sync-check.sqlite3
        run: |
          python manage.py migrate --noinput
          python manage.py sync_training_tasks --dry-run --strict

      - name: Run tests
        run: python manage.py test sandbox traineediary assessment
