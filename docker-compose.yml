name: training-platform

services:
  db:
    image: postgres:16
    container_name: training-platform-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - platform

  redis:
    image: redis:7-alpine
    container_name: training-platform-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - platform

  web:
    build:
      context: .
    container_name: training-platform-web
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      TERMINAL_GATEWAY_ENABLED: "true"
      TERMINAL_NETWORK_MODE: docker_network
      TERMINAL_DOCKER_NETWORK: training-platform-runtime
      CELERY_BROKER_URL: redis://redis:6379/0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/healthz/', headers={'X-Forwarded-Proto':'https'}); urllib.request.urlopen(r, timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - platform

  worker:
    build:
      context: .
    container_name: training-platform-worker
    restart: unless-stopped
    command:
      - celery
      - -A
      - config
      - worker
      - --loglevel=INFO
      - --concurrency=2
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      CELERY_BROKER_URL: redis://redis:6379/0
      TERMINAL_GATEWAY_ENABLED: "true"
      TERMINAL_NETWORK_MODE: docker_network
      TERMINAL_DOCKER_NETWORK: training-platform-runtime
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - platform

  gateway:
    image: nginx:1.28-alpine
    container_name: training-platform-gateway
    restart: unless-stopped
    volumes:
      - ./deploy/nginx/docker/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q --header='X-Forwarded-Proto: https' -O /dev/null http://127.0.0.1/healthz/ || exit 1"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - platform

volumes:
  postgres_data:
  redis_data:

networks:
  platform:
    name: training-platform-runtime