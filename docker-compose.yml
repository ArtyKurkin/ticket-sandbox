name: training-platform

services:
  db:
    image: postgres:16
    container_name: training-platform-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ticket_sandbox
      POSTGRES_USER: ticket_sandbox_user
      POSTGRES_PASSWORD: ticket_sandbox_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - platform

  web:
    build:
      context: .
    container_name: training-platform-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DEBUG: "True"
      TERMINAL_GATEWAY_ENABLED: "true"
      TERMINAL_NETWORK_MODE: docker_network
      TERMINAL_DOCKER_NETWORK: training-platform-runtime
    ports:
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - db
    networks:
      - platform

  gateway:
    image: nginx:1.28-alpine
    container_name: training-platform-gateway
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./deploy/nginx/docker/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    networks:
      - platform

volumes:
  postgres_data:
    external: true
    name: ticket-sandbox_postgres_data

networks:
  platform:
    name: training-platform-runtime