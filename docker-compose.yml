services:
  db:
    image: postgres:16
    container_name: ticket-sandbox-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ticket_sandbox
      POSTGRES_USER: ticket_sandbox_user
      POSTGRES_PASSWORD: ticket_sandbox_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build:
      context: .
    container_name: ticket-sandbox-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  postgres_data: