server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    server_name legacy.example.test;

    ssl_certificate     /etc/nginx/ssl/legacy.crt;
    ssl_certificate_key /etc/nginx/ssl/legacy.key;

    root /var/www/legacy;
    index index.html;

    access_log /var/log/nginx/legacy-access.log;
    error_log  /var/log/nginx/legacy-error.log;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    # После переноса здесь осталось старое имя домена.
    server_name portal-old.example.test;

    ssl_certificate     /etc/nginx/ssl/portal.crt;
    ssl_certificate_key /etc/nginx/ssl/portal.key;

    root /var/www/portal;
    index index.html;

    access_log /var/log/nginx/portal-access.log;
    error_log  /var/log/nginx/portal-error.log;
}
